<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio React</title>

    <!-- React CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">

      function Header() {
        return (
          <header>
            <h1>Sandra de Oliveira Lima</h1>
          </header>
        );
      }

      function Projects() {
        const projetos = [
          { id: 1, nome: "Projeto 1", descricao: "Primeiro projeto em React" },
          { id: 2, nome: "Projeto 2", descricao: "Segundo projeto em React" }
        ];

        return (
          <section>
            <h2>Meus Projetos</h2>
            {projetos.map(p => (
              <div key={p.id}>
                <h3>{p.nome}</h3>
                <p>{p.descricao}</p>
              </div>
            ))}
          </section>
        );
      }

      function App() {
        return (
          <div>
            <Header />

            <section>
              <h2>Sobre mim</h2>
              <p>Portfólio migrado para React com componentização.</p>
            </section>

            <Projects />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);

    </script>
  </body>
</html>
